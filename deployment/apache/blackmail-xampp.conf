# Local XAMPP mapping. Adjust absolute paths if XAMPP lives elsewhere.
# The browser URL is http://localhost/blackmail — only public/ is served.
RedirectMatch 301 ^/blackmail/public(?:/(.*))?$ /blackmail/$1
Alias "/blackmail" "D:/xampp/htdocs/blackmail/public"

<Directory "D:/xampp/htdocs/blackmail">
    AllowOverride None
    Require all denied
</Directory>
<Directory "D:/xampp/htdocs/blackmail/public">
    RewriteEngine On
    RewriteBase /blackmail/
    Options -Indexes +FollowSymLinks
    AllowOverride None
    RewriteCond %{HTTP:Authorization} .
    RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^ /blackmail/index.php [END]
    Require all granted
</Directory>
